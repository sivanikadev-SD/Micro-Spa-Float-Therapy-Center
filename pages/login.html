<!DOCTYPE html>
<html lang="en" data-theme="light" data-dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Serene Float — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Poppins:wght@300;400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
<div id="auth-login" class="page active">
  <div class="auth-header-bar">
    <button class="icon-btn" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
    <button class="icon-btn" onclick="toggleRTL()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M3 5h12M9 5v14M3 9l3-3-3-3M15 5h6M15 19h6M15 12h6"/></svg>
    </button>
  </div>
  <div class="auth-card">
    <a class="logo" href="../index.html" style="justify-content:center;margin-bottom:8px">
      <div class="logo-icon">
        <img src="../assets/images/logo.png" alt="Serene Float Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      Serene Float
    </a>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to manage your sessions & wellness</div>
    <div class="social-btns">
      <button class="social-btn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="social-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Continue with Apple
      </button>
    </div>
    <div class="auth-divider"><span>or sign in with email</span></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" class="form-control" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="pass-wrap">
        <input type="password" class="form-control" placeholder="••••••••" id="loginPass"/>
        <button class="eye-btn" onclick="togglePass('loginPass')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="remember-row">
      <label><input type="checkbox"/> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    <button class="btn btn-primary" onclick="showPage('dashboard')" style="width:100%;padding:13px;">Sign In</button>
    <div class="auth-footer">
      Don't have an account? <a onclick="showPage('auth-signup')">Create one</a>
    </div>
    <div class="auth-footer" style="margin-top:12px">
      <a href="../index.html" style="color:var(--text-muted)">← Back to website</a>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>

</body>
</html>
